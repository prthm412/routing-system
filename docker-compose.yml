services:
  pipeline:
    build:
      context: ./data-pipeline
      dockerfile: Dockerfile.dev
    image: conduit-pipeline-dev
    working_dir: /app
    volumes:
      - ./data-pipeline:/app
      - ./data:/data
    command: bash
  engine:
    build:
      context: ./engine
      dockerfile: Dockerfile.dev
    image: conduit-engine-dev
    working_dir: /workspace
    volumes:
      - ./engine:/workspace
      - ./data:/data
      - engine-build:/build
    command: bash
  service:
    build:
      context: ./service
      dockerfile: Dockerfile.dev
    image: conduit-service-dev
    working_dir: /app
    volumes:
      - ./service:/app
      - ./engine:/engine
      - ./data:/data
      - service-build:/build-py
    command: bash
  db:
    image: postgis/postgis:16-3.4
    env_file:
      - path: .env
        required: false
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  engine-build:
  service-build:
  db-data: