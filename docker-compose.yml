services:
  pipeline:
    build:
      context: ./data-pipeline
      dockerfile: Dockerfile.dev
    image: conduit-pipeline-dev
    working_dir: /app
    volumes:
      - ./data-pipeline:/app
      - ./data:/data
  engine:
    build:
      context: ./engine
      dockerfile: Dockerfile.dev
    image: conduit-engine-dev
    working_dir: /workspace
    volumes:
      - ./engine:/workspace
      - ./data:/data
      - engine-build:/build
    command: bash

volumes:
  engine-build: